name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typescript:
    name: Typecheck & Bun tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      # Test files are intentionally not version-controlled (see .gitignore),
      # so run them only when a checkout happens to contain some.
      - name: Run Bun tests (if present)
        run: |
          if find src \( -name '*.test.ts' -o -name '*.test.tsx' \) -print -quit | grep -q .; then
            bun run test
          else
            echo "No test files found; skipping."
          fi

  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install -r data-service/requirements.txt

      - name: Run unit tests
        working-directory: data-service
        run: python -m unittest discover -s tests -v
